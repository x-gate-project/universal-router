name: Deploy contracts
run-name: Deploy contracts to ${{ inputs.environment }} environment by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select deployment environment'
        required: true
        default: test
        type: choice
        options:
          - test
          - prod
      v3Factory:
        description: 'V3 factory'
        required: true
        type: string

jobs:
  deploy-test-contracts:
    if: ${{ github.event.inputs.environment == 'test' }}
    environment: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Git submodules init and update
        run: |
          git submodule init
          git submodule update
      - name: Setup Node.js v16
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install yarn
        run: npm install -g yarn
      - name: Install dependencies
        run: yarn install
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install dependencies
        run: forge install
      - name: Compile contracts
        run: forge build
      - name: Add deploy parameters
        run: |
          cat > script/deployParameters/DeployJOCTestnet.s.sol << 'EOF'
          // SPDX-License-Identifier: UNLICENSED
          pragma solidity ^0.8.15;

          import {DeployUniversalRouter} from '../DeployUniversalRouter.s.sol';
          import {RouterParameters} from 'contracts/base/RouterImmutables.sol';

          contract DeployJOCTestnet is DeployUniversalRouter {
              function setUp() public override {
                  params = RouterParameters({
                      permit2: 0x000000000022D473030F116dDEE9F6B43aC78BA3,
                      weth9: 0x8B85219c0767Ce4FA5ae5944d71aB4a3De27090d,
                      seaportV1_5: UNSUPPORTED_PROTOCOL,
                      seaportV1_4: UNSUPPORTED_PROTOCOL,
                      openseaConduit: UNSUPPORTED_PROTOCOL,
                      nftxZap: UNSUPPORTED_PROTOCOL,
                      x2y2: UNSUPPORTED_PROTOCOL,
                      foundation: UNSUPPORTED_PROTOCOL,
                      sudoswap: UNSUPPORTED_PROTOCOL,
                      elementMarket: UNSUPPORTED_PROTOCOL,
                      nft20Zap: UNSUPPORTED_PROTOCOL,
                      cryptopunks: UNSUPPORTED_PROTOCOL,
                      looksRareV2: UNSUPPORTED_PROTOCOL,
                      routerRewardsDistributor: UNSUPPORTED_PROTOCOL,
                      looksRareRewardsDistributor: UNSUPPORTED_PROTOCOL,
                      looksRareToken: UNSUPPORTED_PROTOCOL,
                      v2Factory: 0x43bFE3948b41B045261E5A697bbfad00d8328130,
                      v3Factory: ${{ inputs.v3Factory }},
                      pairInitCodeHash: 0x96e8ac4277198ff8b6f785478aa9a39f403cb768dd02cbee326c3e7da348845f,
                      poolInitCodeHash: 0xe34f199b19b2b4f47f68442619d555527d244f78a3297ea89325f843f87b8b54
                  });

                  unsupported = address(0);
              }
          }
          EOF
      - name: Deploy contracts
        run: |
          forge script --broadcast \
          --rpc-url ${{ secrets.JSON_RPC_URL }} \
          --private-key ${{ secrets.PRIVATE_KEY }} \
          --sig 'run()' \
          script/deployParameters/DeployJOCTestnet.s.sol:DeployJOCTestnet

  deploy-prod-contracts:
    if: ${{ github.event.inputs.environment == 'prod' }}
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Git submodules init and update
        run: |
          git submodule init
          git submodule update
      - name: Setup Node.js v16
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install yarn
        run: npm install -g yarn
      - name: Install dependencies
        run: yarn install
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install dependencies
        run: forge install
      - name: Compile contracts
        run: forge build
      - name: Add deploy parameters
        run: |
          cat > script/deployParameters/DeployJOCMainnet.s.sol << 'EOF'
          // SPDX-License-Identifier: UNLICENSED
          pragma solidity ^0.8.15;

          import {DeployUniversalRouter} from '../DeployUniversalRouter.s.sol';
          import {RouterParameters} from 'contracts/base/RouterImmutables.sol';

          contract DeployJOCMainnet is DeployUniversalRouter {
              function setUp() public override {
                  params = RouterParameters({
                      permit2: 0x000000000022D473030F116dDEE9F6B43aC78BA3,
                      weth9: 0x03527b82f384184097295fc60be0B59B8FE06E00,
                      seaportV1_5: UNSUPPORTED_PROTOCOL,
                      seaportV1_4: UNSUPPORTED_PROTOCOL,
                      openseaConduit: UNSUPPORTED_PROTOCOL,
                      nftxZap: UNSUPPORTED_PROTOCOL,
                      x2y2: UNSUPPORTED_PROTOCOL,
                      foundation: UNSUPPORTED_PROTOCOL,
                      sudoswap: UNSUPPORTED_PROTOCOL,
                      elementMarket: UNSUPPORTED_PROTOCOL,
                      nft20Zap: UNSUPPORTED_PROTOCOL,
                      cryptopunks: UNSUPPORTED_PROTOCOL,
                      looksRareV2: UNSUPPORTED_PROTOCOL,
                      routerRewardsDistributor: UNSUPPORTED_PROTOCOL,
                      looksRareRewardsDistributor: UNSUPPORTED_PROTOCOL,
                      looksRareToken: UNSUPPORTED_PROTOCOL,
                      v2Factory: 0x936e3Dc5F46a0fE1BdE6dB255e97B88fB675fEC2,
                      v3Factory: ${{ inputs.v3Factory }},
                      pairInitCodeHash: 0x96e8ac4277198ff8b6f785478aa9a39f403cb768dd02cbee326c3e7da348845f,
                      poolInitCodeHash: 0xe34f199b19b2b4f47f68442619d555527d244f78a3297ea89325f843f87b8b54
                  });

                  unsupported = address(0);
              }
          }
          EOF
      - name: Deploy contracts
        run: |
          forge script --broadcast \
          --rpc-url ${{ secrets.JSON_RPC_URL }} \
          --private-key ${{ secrets.PRIVATE_KEY }} \
          --sig 'run()' \
          script/deployParameters/DeployJOCMainnet.s.sol:DeployJOCMainnet
